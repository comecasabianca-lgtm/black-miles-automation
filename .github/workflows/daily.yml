
name: Black Miles - Publications

on:
  workflow_dispatch:
    inputs:
      trc_link:
        description: "Ton nouveau lien TRC"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate publications
        env:
          TRC_LINK: ${{ inputs.trc_link }}
        run: python generate.py

      - name: Save publications
        uses: actions/upload-artifact@v4
        with:
          name: black-miles-publications
          path: output/
